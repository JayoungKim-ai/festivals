# Render Free 플랜은 약 15분 무요청 시 슬립합니다.
# /health 를 주기적으로 호출해 idle 타임아웃을 피합니다.
name: Keep Render Awake

on:
  schedule:
    # 12분마다 (UTC). GitHub 스케줄은 수 분 지연될 수 있음.
    - cron: '*/12 * * * *'
  # 수동 실행으로 동작 확인용
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /health
        run: |
          HEALTH_URL="https://festivals-nmj9.onrender.com/health"
          echo "Pinging $HEALTH_URL"
          curl -fsS --retry 2 --retry-delay 5 --max-time 60 "$HEALTH_URL"
          echo
          echo "OK"
